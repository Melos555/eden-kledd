name: Release Eden (Windows + Linux)

# Push a tag like v0.4-stutterfix to build Windows x64 and Linux x86_64 on GitHub's runners and
# publish them as a GitHub Release. Nothing is built or uploaded by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    uses: ./.github/workflows/build-windows.yml

  linux:
    name: Linux x86_64
    uses: ./.github/workflows/build-linux.yml

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          (cd artifacts/eden-kledd-windows && zip -qr "../../release/eden-kledd-${tag}-windows-x86_64.zip" .)
          cp artifacts/eden-kledd-linux-x86_64/eden-kledd-linux-x86_64.tar.gz "release/eden-kledd-${tag}-linux-x86_64.tar.gz"
          cp artifacts/eden-kledd-linux-appimage/eden-kledd-x86_64.AppImage "release/eden-kledd-${tag}-linux-x86_64.AppImage"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eden-kledd ${{ github.ref_name }}
          files: release/*
          body: |
            Metroid Prime 4: Beyond stutter fix, on top of the v0.3 audio hang fix and the v0.2 scan fix.

            - The game no longer freezes for up to a second every few seconds, in new areas and in areas already loaded. Metroid Prime 4 streams texture tiles into six huge 3D texture pools (477-955 MiB each), and Eden re-uploaded a whole pool to the GPU every time the game wrote a page into it or remapped one of its pages. The texture cache now keeps these pools write-protected in 16-slice groups and uploads only the groups the game touched: a few MiB in 1-3 ms instead of 3.3 GB in 750 ms.
            - The spot in Volt Forge that ran at 6 fps (the game writes one pool there every frame) runs at full speed for the same reason.
            - The first visit of an area still uploads each pool once in full, so a short hitch on entering a new area remains.
            - Everything from v0.3: audio no longer buzzes when the game stalls while loading, the sound output never replays stale buffer memory, the sleep on every file read while a video decoder is open is gone, and the upstream async shader revert (PR 4512) and composer buffer release (PR 4548) are carried over.
            - Diagnostics in the log for texture uploads, GPU thread lag, audio starvation and GPU stalls; the per-frame texture log is off unless kledd_frame_log is enabled.

            Windows: unzip and run eden.exe. Linux: run the AppImage (built on Debian 13, works on SteamOS) or unpack the tarball.
