<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="body" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.55" stop-color="#f2793a"/>
      <stop offset="1" stop-color="#c9531f"/>
    </radialGradient>
    <radialGradient id="choc" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6b3a24"/>
      <stop offset="1" stop-color="#3d1f12"/>
    </radialGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be08a"/>
      <stop offset="1" stop-color="#3fae55"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="256" cy="448" rx="150" ry="22" fill="#000" opacity="0.18"/>

  <!-- gooey splat body -->
  <path fill="url(#body)" stroke="#a5421a" stroke-width="6" stroke-linejoin="round" d="
    M256 92
    C300 92 318 64 344 78 C370 92 352 124 380 140
    C412 158 444 146 452 178 C460 210 424 222 428 254
    C432 288 470 300 456 334 C442 366 404 350 384 378
    C366 404 380 440 346 446 C312 452 300 420 256 420
    C212 420 200 452 166 446 C132 440 146 404 128 378
    C108 350 70 366 56 334 C42 300 80 288 84 254
    C88 222 52 210 60 178 C68 146 100 158 132 140
    C160 124 142 92 168 78 C194 64 212 92 256 92 Z"/>

  <!-- chocolate goo drip on top -->
  <path fill="url(#choc)" d="
    M176 120 C200 104 230 110 256 108 C284 106 312 104 336 120
    C346 128 340 140 330 140 C322 140 322 160 312 162 C300 164 302 146 292 146
    C282 146 284 176 270 178 C256 180 260 150 248 150 C236 150 238 168 226 168
    C214 168 218 146 206 146 C196 146 198 158 188 156 C176 154 170 128 176 120 Z"/>
  <ellipse cx="236" cy="122" rx="20" ry="6" fill="#fff" opacity="0.25"/>

  <!-- bow -->
  <g transform="translate(344 118) rotate(18)">
    <path d="M0 0 C-30 -26 -52 -10 -48 8 C-44 26 -22 22 0 0 Z" fill="url(#bow)" stroke="#2c7a3d" stroke-width="4"/>
    <path d="M0 0 C30 -26 52 -10 48 8 C44 26 22 22 0 0 Z" fill="url(#bow)" stroke="#2c7a3d" stroke-width="4"/>
    <circle r="10" fill="#4cc463" stroke="#2c7a3d" stroke-width="4"/>
  </g>

  <!-- sassy brows -->
  <path d="M178 212 C192 190 218 184 238 200" fill="none" stroke="#3d1f12" stroke-width="10" stroke-linecap="round"/>
  <path d="M278 226 C298 222 318 224 338 230" fill="none" stroke="#3d1f12" stroke-width="10" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="208" cy="258" rx="22" ry="27" fill="#2a140b"/>
  <ellipse cx="306" cy="258" rx="22" ry="27" fill="#2a140b"/>
  <circle cx="216" cy="248" r="8" fill="#fff"/>
  <circle cx="314" cy="248" r="8" fill="#fff"/>
  <circle cx="202" cy="268" r="3.5" fill="#fff" opacity="0.8"/>
  <circle cx="300" cy="268" r="3.5" fill="#fff" opacity="0.8"/>

  <!-- blush -->
  <ellipse cx="164" cy="300" rx="24" ry="13" fill="#ff5d7a" opacity="0.55"/>
  <ellipse cx="350" cy="300" rx="24" ry="13" fill="#ff5d7a" opacity="0.55"/>

  <!-- smug little smile -->
  <path d="M230 314 C248 330 272 326 290 304" fill="none" stroke="#3d1f12" stroke-width="9" stroke-linecap="round"/>

  <!-- tiny arm holding a scan-visor reticle -->
  <path d="M420 300 C446 292 458 270 462 252" fill="none" stroke="#c9531f" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(466 220)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#0b1a2a" opacity="0.85"/>
    <path d="M-22 -10 L-22 -22 L-10 -22 M10 -22 L22 -22 L22 -10 M22 10 L22 22 L10 22 M-10 22 L-22 22 L-22 10"
