<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0c1d36"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#4fd8ff" opacity="0.06"/>
    </pattern>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="300" rx="14" fill="url(#bg)"/>
  <rect width="960" height="300" rx="14" fill="url(#scan)"/>
  <rect x="6" y="6" width="948" height="288" rx="11" fill="none" stroke="#4fd8ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- corner brackets -->
  <g stroke="#4fd8ff" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#g)">
    <path d="M20 54 L20 20 L54 20"/><path d="M906 20 L940 20 L940 54"/>
    <path d="M940 246 L940 280 L906 280"/><path d="M54 280 L20 280 L20 246"/>
  </g>

  <!-- Lab Kledd -->
  <svg x="24" y="24" width="252" height="252" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="k_body" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#4a6fa8"/>
      <stop offset="0.55" stop-color="#25407a"/>
      <stop offset="1" stop-color="#121f45"/>
    </radialGradient>
    <radialGradient id="k_choc" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#9a5cb8"/>
      <stop offset="0.55" stop-color="#5e3a8c"/>
      <stop offset="1" stop-color="#2f1d55"/>
    </radialGradient>
    <linearGradient id="k_bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be08a"/>
      <stop offset="1" stop-color="#3fae55"/>
    </linearGradient>
    <filter id="k_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="k_splat">
      <path d="M256 92 C300 92 318 64 344 78 C370 92 352 124 380 140 C412 158 444 146 452 178 C460 210 424 222 428 254 C432 288 470 300 456 334 C442 366 404 350 384 378 C366 404 380 440 346 446 C312 452 300 420 256 420 C212 420 200 452 166 446 C132 440 146 404 128 378 C108 350 70 366 56 334 C42 300 80 288 84 254 C88 222 52 210 60 178 C68 146 100 158 132 140 C160 124 142 92 168 78 C194 64 212 92 256 92 Z"/>
    </clipPath>
  </defs>

  <!-- shadow -->
  <ellipse cx="256" cy="448" rx="150" ry="22" fill="#000" opacity="0.22"/>

  <!-- gooey splat body, midnight blue with a cyan scan glow -->
  <path fill="url(#k_body)" stroke="#4fd8ff" stroke-width="6" stroke-linejoin="round" filter="url(#k_glow)" d="
    M256 92
    C300 92 318 64 344 78 C370 92 352 124 380 140
    C412 158 444 146 452 178 C460 210 424 222 428 254
    C432 288 470 300 456 334 C442 366 404 350 384 378
    C366 404 380 440 346 446 C312 452 300 420 256 420
    C212 420 200 452 166 446 C132 440 146 404 128 378
    C108 350 70 366 56 334 C42 300 80 288 84 254
    C88 222 52 210 60 178 C68 146 100 158 132 140
    C160 124 142 92 168 78 C194 64 212 92 256 92 Z"/>

  <!-- faint scanlines inside the body -->
  <g clip-path="url(#k_splat)" opacity="0.13" stroke="#9fe9ff" stroke-width="2">
    <line x1="40" y1="180" x2="472" y2="180"/><line x1="40" y1="200" x2="472" y2="200"/>
    <line x1="40" y1="220" x2="472" y2="220"/><line x1="40" y1="340" x2="472" y2="340"/>
    <line x1="40" y1="360" x2="472" y2="360"/><line x1="40" y1="380" x2="472" y2="380"/>
    <line x1="40" y1="400" x2="472" y2="400"/>
  </g>

  <!-- chocolate goo drip on top -->
  <path fill="url(#k_choc)" d="
    M176 120 C200 104 230 110 256 108 C284 106 312 104 336 120
    C346 128 340 140 330 140 C322 140 322 160 312 162 C300 164 302 146 292 146
    C282 146 284 176 270 178 C256 180 260 150 248 150 C236 150 238 168 226 168
    C214 168 218 146 206 146 C196 146 198 158 188 156 C176 154 170 128 176 120 Z"/>
  <ellipse cx="236" cy="122" rx="20" ry="6" fill="#f0c6ff" opacity="0.35"/>

  <!-- bow (stays green, it's her) -->
  <g transform="translate(344 118) rotate(18)">
    <path d="M0 0 C-30 -26 -52 -10 -48 8 C-44 26 -22 22 0 0 Z" fill="url(#k_bow)" stroke="#2c7a3d" stroke-width="4"/>
    <path d="M0 0 C30 -26 52 -10 48 8 C44 26 22 22 0 0 Z" fill="url(#k_bow)" stroke="#2c7a3d" stroke-width="4"/>
    <circle r="10" fill="#4cc463" stroke="#2c7a3d" stroke-width="4"/>
  </g>

  <!-- brows: left one shot way up, right one flat and suspicious -->
  <path d="M174 196 C186 164 214 156 238 174" fill="none" stroke="#e8f6ff" stroke-width="10" stroke-linecap="round"/>
  <path d="M280 222 C298 218 318 220 338 226" fill="none" stroke="#e8f6ff" stroke-width="10" stroke-linecap="round"/>

  <!-- eyes: left wide open, right narrowed -->
  <g filter="url(#k_glow)">
    <ellipse cx="208" cy="256" rx="29" ry="35" fill="none" stroke="#e8f6ff" stroke-opacity="0.95" stroke-width="3.5"/>
    <ellipse cx="208" cy="256" rx="22" ry="28" fill="#e8f6ff" fill-opacity="0.62"/>
  </g>
  <g filter="url(#k_glow)">
    <ellipse cx="306" cy="262" rx="26" ry="24" fill="none" stroke="#e8f6ff" stroke-opacity="0.95" stroke-width="3.5"/>
    <ellipse cx="306" cy="262" rx="19" ry="17" fill="#e8f6ff" fill-opacity="0.62"/>
  </g>

  <!-- blush, cooler pink against blue -->
  <ellipse cx="160" cy="304" rx="24" ry="13" fill="#ff7aa8" opacity="0.45"/>
  <ellipse cx="352" cy="304" rx="24" ry="13" fill="#ff7aa8" opacity="0.45"/>

  <!-- shocked little O -->
  <ellipse cx="258" cy="322" rx="15" ry="19" fill="#0a1226" stroke="#e8f6ff" stroke-width="4"/>

  <!-- sweat drop -->
  <path d="M378 196 C372 210 366 218 366 226 C366 234 372 240 380 240 C388 240 394 234 394 226 C394 218 386 210 378 196 Z" fill="#9fe9ff" opacity="0.9"/>

  <!-- tiny arm holding the scan-visor reticle, now glowing -->
  <path d="M420 300 C446 292 458 270 462 252" fill="none" stroke="#25407a" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(466 220)" filter="url(#k_glow)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#06101c" opacity="0.92"/>
    <path d="M-22 -10 L-22 -22 L-10 -22 M10 -22 L22 -22 L22 -10 M22 10 L22 22 L10 22 M-10 22 L-22 22 L-22 10"
          fill="none" stroke="#4fd8ff" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#4fd8ff" opacity="0.9"/>
  </g>
</svg>

  <!-- divider -->
  <line x1="292" y1="44" x2="292" y2="256" stroke="#4fd8ff" stroke-opacity="0.4" stroke-width="2"/>

  <!-- scan readout -->
  <g font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" fill="#9fe9ff">
    <text x="318" y="64" font-size="15" letter-spacing="3" fill="#4fd8ff" filter="url(#g)">SCAN COMPLETE  //  LOGBOOK: RESEARCH</text>
    <rect x="318" y="76" width="210" height="3" fill="#4fd8ff" opacity="0.8"/>
    <text x="318" y="124" font-size="30" font-weight="bold" fill="#e8f6ff" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">You're touching something</text>
    <text x="318" y="162" font-size="30" font-weight="bold" fill="#e8f6ff" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">incredibly <tspan fill="#4fd8ff" filter="url(#g)">Kleddular</tspan>.</text>
    <text x="318" y="204" font-size="16">Experimental lab build. Untested features may misbehave.</text>
    <text x="318" y="228" font-size="16">Back up your shader cache. Report bugs to Melos, not Eden.</text>
    <text x="318" y="262" font-size="13" fill="#4fd8ff" opacity="0.75" letter-spacing="2">SPECIMEN: LAB KLEDD  ·  STATUS: ;O  ·  THREAT LEVEL: SMUG</text>
  </g>
</svg>
